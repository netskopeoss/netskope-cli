# Publish to PyPI when a vX.Y.Z tag is pushed (release runbook step 5). The
# GitHub Release is created after this run succeeds, so a failed publish never
# leaves a public release pointing at a version PyPI does not have.
#
# Authentication is PyPI's Trusted Publisher for this repository, so no token
# is stored anywhere. One-time setup on pypi.org for the `netskope` project:
# Publishing -> Add a new publisher -> GitHub, owner `netskopeoss`, repository
# `netskope-cli`, workflow `release.yml`, environment `pypi`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"

jobs:
  build:
    name: check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
      - name: tag must match the project version
        run: |
          version="$(uv version --short)"
          echo "pyproject version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q
      - run: uv build
      # The published artifacts get the same clean-install check as every pull request.
      - name: install each artifact into a clean environment and run it
        run: ./scripts/smoke-dist.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      # --check-url lets a rerun skip files PyPI already has, so a network error
      # part-way through an upload is retryable instead of a permanent duplicate.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
