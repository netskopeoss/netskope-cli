[project]
name = "netskope"
version = "1.4.8"
description = "The official Netskope CLI — manage your Netskope tenant from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Netskope" }]
requires-python = ">=3.11"
keywords = ["netskope", "cli", "sase", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# Runtime dependencies are pinned exactly: open ranges let fresh installs drift
# away from the versions the test suite ran against, and typer 0.26 showed how
# quietly that can break things (see v1.4.6). Bump deliberately: change the pin,
# run `uv lock` and the full suite, then re-verify `netskope commands` on a fresh
# install of the built wheel.
dependencies = [
    "typer==0.27.2",
    "rich==14.3.4",
    "shellingham==1.5.4",
    "httpx==0.28.1",
    "toml==0.10.2",
    "keyring==25.7.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
browser = ["playwright==1.58.0"]

[project.urls]
Homepage = "https://netskopeoss.github.io/netskope-cli/"
Repository = "https://github.com/netskopeoss/netskope-cli"
Documentation = "https://netskopeoss.github.io/netskope-cli/"
Changelog = "https://github.com/netskopeoss/netskope-cli/blob/master/CHANGELOG.md"
Issues = "https://github.com/netskopeoss/netskope-cli/issues"

[project.scripts]
netskope = "netskope_cli.main:cli"
ntsk = "netskope_cli.main:cli"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "respx==0.22.0",
    "ruff==0.15.5",
    "ty==0.0.79",
]

# hatchling rather than uv_build: Homebrew installs the sdist with pip's
# --no-binary=:all:, which pip also applies to build dependencies, so a compiled
# backend would be built from its Rust sources on every `brew install`. hatchling
# is pure Python and, like poetry-core before it, leaves VCS-ignored files (.env,
# editor swap files) out of the wheel and the sdist.
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netskope_cli"]

[tool.hatch.build.targets.sdist]
# hatchling always adds pyproject.toml, the readme and the license file.
only-include = ["src/netskope_cli", "CHANGELOG.md"]

# Target Python version is inferred from requires-python.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Python version is inferred from requires-python. Type-check the package;
# tests are exercised by pytest.
[tool.ty.src]
include = ["src"]

# playwright is an optional extra ([browser]); browser_auth.py imports it lazily
# behind try/except ImportError, so it is absent from a base install.
[[tool.ty.overrides]]
include = ["src/netskope_cli/core/browser_auth.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
