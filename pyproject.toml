[project]
name = "netskope"
version = "1.4.8"
description = "The official Netskope CLI — manage your Netskope tenant from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Netskope" }]
requires-python = ">=3.11"
# Poetry derived these from the python constraint; PEP 621 needs them spelled out.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Runtime dependencies are pinned exactly. typer 0.26 bundled its own copy of
# click and reshaped its command classes (see v1.4.6; the tree walkers use
# typer.core's public classes), and
# open ranges let fresh installs drift away from the versions the test suite runs
# against. Bump deliberately: change the pin, `uv lock`, run the full suite, then
# re-verify `netskope commands` on a fresh install of the built wheel.
dependencies = [
    "typer==0.27.2",
    "rich==14.3.4",
    "shellingham==1.5.4",
    "httpx==0.28.1",
    "toml==0.10.2",
    "keyring==25.7.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
browser = ["playwright==1.58.0"]

[project.urls]
Homepage = "https://netskopeoss.github.io/netskope-cli/"
Repository = "https://github.com/netskopeoss/netskope-cli"
Documentation = "https://netskopeoss.github.io/netskope-cli/"

[project.scripts]
netskope = "netskope_cli.main:cli"
ntsk = "netskope_cli.main:cli"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "respx==0.22.0",
    "ruff==0.15.5",
    "ty==0.0.79",
]

# hatchling rather than uv_build: Homebrew installs the sdist with pip's
# --no-binary=:all:, which pip also applies to build dependencies, so a compiled
# backend would be built from its Rust sources on every `brew install`. hatchling
# is pure Python and, like poetry-core before it, leaves VCS-ignored files (.env,
# editor swap files) out of the wheel and the sdist.
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netskope_cli"]

[tool.hatch.build.targets.sdist]
only-include = ["src/netskope_cli", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.11"

# Type-check the package; tests are exercised by pytest.
[tool.ty.src]
include = ["src"]

# playwright is an optional extra ([browser]); browser_auth.py imports it lazily
# behind try/except ImportError, so it is absent from a base install.
[[tool.ty.overrides]]
include = ["src/netskope_cli/core/browser_auth.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
